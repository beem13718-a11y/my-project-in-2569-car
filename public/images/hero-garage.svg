<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#131c31"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Garage Ceiling Lights -->
  <rect x="120" y="25" width="160" height="8" rx="4" fill="#e0f2fe"/>
  <polygon points="120,33 280,33 340,260 60,260" fill="url(#glow)"/>
  <rect x="500" y="25" width="160" height="8" rx="4" fill="#e0f2fe"/>
  <polygon points="500,33 660,33 720,260 440,260" fill="url(#glow)"/>
  <!-- Background Workshop Grid & Tool Board -->
  <rect x="60" y="90" width="180" height="120" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <text x="80" y="120" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">OBD-II DIAGNOSTICS</text>
  <polyline points="80,170 110,170 125,140 145,190 165,155 185,170 220,170" fill="none" stroke="#10b981" stroke-width="3"/>
  <!-- Hydraulic Lift Posts -->
  <rect x="170" y="110" width="26" height="290" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="580" y="110" width="26" height="290" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="150" y="275" width="480" height="14" rx="4" fill="#334155" stroke="#64748b" stroke-width="2"/>
  <!-- Sports Sedan on Lift -->
  <path d="M200,245 L245,235 L305,185 L485,185 L555,230 L595,245 L595,272 L200,272 Z" fill="url(#carBody)"/>
  <path d="M312,193 L400,193 L400,230 L265,230 Z" fill="#0f172a"/>
  <path d="M410,193 L478,193 L535,230 L410,230 Z" fill="#0f172a"/>
  <!-- Headlight & Taillight Glow -->
  <ellipse cx="592" cy="252" rx="6" ry="10" fill="#fef08a"/>
  <polygon points="598,245 740,210 740,295 598,260" fill="#fef08a" fill-opacity="0.18"/>
  <rect x="200" y="246" width="10" height="14" rx="3" fill="#ef4444"/>
  <!-- Wheels -->
  <circle cx="275" cy="272" r="34" fill="#090d16" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="275" cy="272" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="515" cy="272" r="34" fill="#090d16" stroke="#94a3b8" stroke-width="5"/>
  <circle cx="515" cy="272" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <!-- Workshop Floor -->
  <rect x="0" y="395" width="800" height="105" fill="#05080f"/>
  <line x1="0" y1="395" x2="800" y2="395" stroke="#38bdf8" stroke-width="2"/>
</svg>
